            // SEMANA 1: CONSCIENTIZAÇÃO
            { id: 'p1', author: 'Luan', format: 'Reels', title: 'A armadilha do Lead Barato', script: 'Gancho: Seu marketing comemora o lead a 2 reais, mas o comercial não bate meta?\n\nDesenvolvimento: Luan explica que lead barato geralmente é curioso. No marketing de performance, o foco não é o custo do clique, é o custo do contrato assinado. O vendedor perde tempo com curioso e a empresa queima dinheiro.\n\nCTA: Pare de olhar pro CPC e olhe pro seu funil de vendas.', status: 'ideia', date: '2026-05-04', time: '12:00' },
            { id: 'p2', author: 'Hebert', format: 'Carrossel', title: 'A conta que quebra empresas', script: 'Slide 1: A matemática silenciosa que quebra empresas na internet.\nSlide 2: O erro: Escalar o Meta Ads sem saber seu CAC máximo (Custo de Aquisição).\nSlide 3: A solução: Unit Economics. Você precisa saber o limite de gasto por cliente.\nSlide 4: LTV (Lifetime Value). Seu cliente compra uma vez ou fica 1 ano? O seu modelo de negócios dita seu marketing.\nSlide 5: Entenda como diagnosticamos isso na Scale X.', status: 'ideia', date: '2026-05-06', time: '18:00' },
            { id: 'p3', author: 'Raniele', format: 'Reels', title: 'Por que seu Instagram não vende?', script: 'Gancho: Você posta todos os dias, mas seu Instagram parece uma vitrine morta?\n\nDesenvolvimento: Raniele explica que empresa não precisa viralizar com dancinha. Orgânico B2B serve para construir um "ecossistema de confiança". Conteúdo profundo, que educa o lead, mata dúvidas técnicas e prova que você é especialista.\n\nCTA: Orgânico é o seu melhor vendedor trabalhando 24h por dia. Comece a educar seu mercado.', status: 'ideia', date: '2026-05-07', time: '19:00' },
            { id: 'p4', author: 'Scale X', format: 'Estático', title: 'A Máquina e o Gargalo', script: 'Imagem: Ilustração de engrenagens / Máquina.\n\nLegenda: Toda empresa é uma máquina. E se você colocar mais combustível (tráfego pago) enquanto o cano está furado (retenção ou comercial fraco), o motor explode. A Scale X não acelera antes de consertar a sua engrenagem. É por isso que exigimos o Blueprint Estratégico.', status: 'ideia', date: '2026-05-08', time: '15:00' },
            
            // SEMANA 2: MÉTODOS
            { id: 'p5', author: 'Luan', format: 'Carrossel', title: 'Engenharia > Criatividade', script: 'Slide 1: O marketing "fofinho" não paga a folha de pagamento.\nSlide 2: Agência comum: Foca em Layout bonito e posts de bom dia.\nSlide 3: Engenharia de Vendas (Nós): Funil mapeado, script alinhado, traqueamento de eventos (Pixel) e remarketing dinâmico.\nSlide 4: Seu time comercial não quer likes. Quer oportunidades prontas.\nSlide 5: Se o seu marketing não é intencional, ele é inútil.', status: 'ideia', date: '2026-05-11', time: '18:00' },
            { id: 'p6', author: 'Raniele', format: 'Reels', title: 'Orgânico quebra Objeções', script: 'Gancho: Você acha que orgânico e tráfego pago não se misturam? Errado.\n\nDesenvolvimento: Raniele ensina que quando o lead clica no seu anúncio, a primeira coisa que ele faz é ir no seu perfil stalkear. Se o seu perfil tem conteúdo forte explicando o método e quebrando objeções comuns, o lead chega no seu comercial 50% mais pronto para comprar.\n\nCTA: O orgânico abaixa o CAC do seu tráfego pago. Construa sua base.', status: 'ideia', date: '2026-05-13', time: '18:00' },
            { id: 'p7', author: 'Scale X', format: 'Carrossel', title: 'A Metodologia I.O.E.', script: 'Slide 1: A anatomia do crescimento previsível da Scale X.\nSlide 2: [ I ] Intelligence: O Raio-X de 30 dias. Onde está o gargalo?\nSlide 3: [ O ] Operation: Arrumar a casa. Implementar CRM, LPs, Dados.\nSlide 4: [ E ] Escala: O pé no acelerador. Advisory de Growth.\nSlide 5: Profissionais seniores não pulam etapas.', status: 'ideia', date: '2026-05-14', time: '12:00' },
            { id: 'p8', author: 'Hebert', format: 'Reels', title: 'O Custo Invisível do Churn', script: 'Gancho: Você gasta rios de dinheiro comprando cliente novo, só para perder os antigos no mês seguinte.\n\nDesenvolvimento: Hebert explica o conceito financeiro do balde furado. Na lógica de consultoria de negócios, não adianta tracionar vendas se o "Churn" (taxa de cancelamento) é alto. O verdadeiro lucro mora no LTV e no Upsell.\n\nCTA: Marketing não termina quando o contrato é assinado. Ele começa ali.', status: 'ideia', date: '2026-05-15', time: '18:00' },

            // SEMANA 3: AUTORIDADE
            { id: 'p9', author: 'Luan', format: 'Reels', title: 'O Fim do Mkt de Esperança', script: 'Gancho: "Impulsionei um post aqui, vamos cruzar os dedos pra vender". Se você age assim, sua empresa corre risco.\n\nDesenvolvimento: Luan ataca o modelo de intuição. Explica que crescimento real é um loop de dados: Teste -> Análise de CAC -> Otimização -> Escala. Se não é rastreável, não é growth.\n\nCTA: Quer previsibilidade? Pare de apostar e comece a metrificar.', status: 'ideia', date: '2026-05-18', time: '18:00' },
            { id: 'p10', author: 'Hebert', format: 'Carrossel', title: 'O custo de não ter processos', script: 'Slide 1: Quanto custa a desorganização do seu time comercial hoje?\nSlide 2: O marketing traz o lead, mas o vendedor demora 2 horas para chamar = Dinheiro rasgado.\nSlide 3: O lead não compra hoje e ninguém faz follow-up amanhã = Dinheiro rasgado.\nSlide 4: Nossa Fase de Operation implementa a estrutura de CRM e SLA de atendimento para o marketing fazer sentido.\nSlide 5: Conheça a Scale X.', status: 'ideia', date: '2026-05-20', time: '12:00' },
            { id: 'p11', author: 'Scale X', format: 'Reels', title: 'Bastidores: A Reunião', script: 'Formato: Vídeo estilo vlog corporativo.\n\nCena: O Board da Scale X discutindo a operação de um cliente. Luan falando sobre CAC e CPC, Hebert cruzando isso com a estrutura do funil no CRM, Raniele propondo uma linha editorial para reduzir atrito.\n\nLegenda: Não terceirize a inteligência da sua empresa para estagiários. Aqui nós instalamos cérebros na sua operação.', status: 'ideia', date: '2026-05-21', time: '19:00' },
            { id: 'p12', author: 'Raniele', format: 'Estático', title: 'Autoridade não se compra', script: 'Imagem Limpa e Direta: "Tráfego pago compra atenção. Conteúdo orgânico compra confiança."\n\nLegenda: Raniele explica que injetar dinheiro no Meta Ads vai atrair olhos para a sua empresa, mas se a pessoa entrar na sua "casa" (seu Instagram/Site) e não vir profundidade, autoridade e conhecimento, ela vai comprar do seu concorrente. A construção orgânica é o pilar da conversão.', status: 'ideia', date: '2026-05-22', time: '18:00' },

            // SEMANA 4: OFERTA (BLUEPRINT)
            { id: 'p13', author: 'Luan', format: 'Carrossel', title: 'As 4 travas de Receita', script: 'Slide 1: Onde a sua máquina de receita engasgou?\nSlide 2: 1. Cegueira de Dados? (Não sabe de onde o cliente vem).\nSlide 3: 2. Tráfego desqualificado? (Muito curioso, pouco decisor).\nSlide 4: 3. Script falho? (Lead bom chega, mas o time não fecha).\nSlide 5: 4. Churn alto? (Vende muito e cancela muito).\nSlide 6: Identificar é o passo 1. Aplique para o nosso Blueprint.', status: 'ideia', date: '2026-05-25', time: '18:00' },
            { id: 'p14', author: 'Hebert', format: 'Reels', title: 'Calculadora ROI', script: 'Gancho: Você sabe me dizer exatamente quanto lucra a cada 100 reais investidos em marketing?\n\nDesenvolvimento: Hebert apresenta a lógica do Simulador de ROI (mostrando a tela da Landing Page). Explica que o papel do CEO não é aprovar layout, é olhar para o painel de Unit Economics e entender se a máquina está imprimindo ou rasgando dinheiro.\n\nCTA: Acesse a nossa calculadora no link da bio e descubra seu potencial.', status: 'ideia', date: '2026-05-27', time: '18:00' },
            { id: 'p15', author: 'Scale X', format: 'Reels', title: 'Por que recusamos clientes', script: 'Locução Oficial: Todo mês nós recusamos projetos na Scale X.\n\nDesenvolvimento: Se a empresa chega querendo "pular etapas" e recusa fazer o Diagnóstico inicial (Blueprint), nós não assumimos a conta. Entrar operando tráfego sem entender os processos comerciais da empresa é receita pro fracasso. Somos parceiros de negócio, não uma agência tarefeira.\n\nCTA: Buscamos clientes maduros.', status: 'ideia', date: '2026-05-28', time: '12:00' },
            { id: 'p16', author: 'Scale X', format: 'Estático', title: 'Sua empresa qualifica?', script: 'Imagem: Layout premium convidando para a Sessão Estratégica.\n\nLegenda: Buscamos empresas que entendem que o marketing precisa ser gerido por dados financeiros e engenharia de vendas. Abrimos vagas limitadas para aplicar a Fase 1 da nossa metodologia (Blueprint Estratégico). Clique no link da bio, preencha o formulário e agende uma conversa com nosso Board.', status: 'ideia', date: '2026-05-29', time: '18:00' }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            
            // Garantir que a sidebar comece no estado certo no desktop
            if(window.innerWidth >= 768) {
                const sidebar = document.getElementById('sidebar-backlog');
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
            }
            
            renderCalendar();
        });

        function loadData() {
            // Mudei a chave do localStorage para v3, assim forçamos o navegador a buscar as 16 ideias novas que acabei de reinserir, e não o cache da visualização antiga.
            const savedData = localStorage.getItem('scalex_calendar_v3');
            if (savedData) {
                editorialPlan = JSON.parse(savedData);
            } else {
                editorialPlan = [...initialPlan];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('scalex_calendar_v3', JSON.stringify(editorialPlan));
        }

        function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
        function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

        function getMonthName(monthIndex) {
            const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            return months[monthIndex];
        }

        function formatDate(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('current-month-year').innerText = `${getMonthName(month)} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            sortables.forEach(s => s.destroy());
            sortables = [];

            const today = new Date();
            const isCurrentMonth = today.getMonth() === month && today.getFullYear() === year;

            let dayCount = 1;
            let nextMonthDayCount = 1;
            const totalCells = (firstDay + daysInMonth > 35) ? 42 : 35;

            // Opções do Sortable focadas em Touch
            const sortableOptions = {
                group: 'calendar',
                animation: 150,
                ghostClass: 'sortable-ghost',
                delay: 150, // Permite scrolling no mobile sem acionar o drag
                delayOnTouchOnly: true, // Só aplica o delay no mobile
                fallbackTolerance: 3,
                onEnd: handleDragEnd
            };

            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day relative group cursor-pointer';

                let cellDate = null;
                let isCurrentMonthCell = false;

                if (i < firstDay) {
                    cell.classList.add('empty-day');
                    cell.innerHTML = `<span class="text-[10px] font-bold opacity-30">${daysInPrevMonth - firstDay + i + 1}</span>`;
                } else if (dayCount <= daysInMonth) {
                    cellDate = formatDate(year, month, dayCount);
                    isCurrentMonthCell = true;
                    
                    if (isCurrentMonth && dayCount === today.getDate()) {
                        cell.classList.add('today');
                        cell.innerHTML = `
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold text-brand-orange bg-brand-orange/10 px-1.5 py-0.5 rounded">${dayCount}</span>
                            </div>
                        `;
                    } else {
                        cell.innerHTML = `
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold text-gray-400 group-hover:text-white transition-colors">${dayCount}</span>
                            </div>
                        `;
                    }

                    const postContainer = document.createElement('div');
                    postContainer.className = 'flex-1 flex flex-col gap-1 mt-1 min-h-[30px]';
                    postContainer.dataset.date = cellDate;
                    
                    const dayPosts = editorialPlan.filter(p => p.date === cellDate);
                    dayPosts.sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
                    dayPosts.forEach(post => postContainer.appendChild(createPostCard(post)));

                    cell.appendChild(postContainer);
                    
                    cell.addEventListener('click', (e) => {
                        if(e.target === cell || e.target.classList.contains('flex-1')) {
                            openModal(null, cellDate);
                        }
                    });
                    dayCount++;
                } else {
                    cell.classList.add('empty-day');
                    cell.innerHTML = `<span class="text-[10px] font-bold opacity-30">${nextMonthDayCount++}</span>`;
                }

                grid.appendChild(cell);

                if (isCurrentMonthCell) {
                    sortables.push(new Sortable(cell.querySelector('.flex-1'), sortableOptions));
                }
            }
            renderBacklog(sortableOptions);
        }

        function renderBacklog(sortableOptions) {
            const backlog = document.getElementById('backlog-container');
            backlog.innerHTML = '';
            
            const backlogPosts = editorialPlan.filter(p => !p.date);
            if (backlogPosts.length === 0) {
                backlog.innerHTML = `<div class="text-center p-3 border border-dashed border-brand-border rounded-lg text-gray-600 text-[10px]">A gaveta está vazia.</div>`;
            } else {
                backlogPosts.forEach(post => backlog.appendChild(createPostCard(post, true)));
            }

            sortables.push(new Sortable(backlog, sortableOptions));
        }

        function createPostCard(post, isBacklog = false) {
            const style = authorConfig[post.author] || authorConfig['Scale X'];
            const icon = formatIcons[post.format] || '<i class="fa-solid fa-file"></i>';
            
            let statusDot = '';
            if (post.status === 'postado') statusDot = '<div class="w-1.5 h-1.5 rounded-full bg-green-500 absolute top-1 right-1"></div>';
            else if (post.status === 'producao') statusDot = '<div class="w-1.5 h-1.5 rounded-full bg-blue-500 absolute top-1 right-1"></div>';

            const card = document.createElement('div');
            card.className = `relative flex items-center gap-1.5 p-1.5 md:p-2 rounded border-l-2 ${style.border} ${style.bg} bg-opacity-40 border border-t-white/5 border-r-white/5 border-b-white/5 cursor-grab hover:brightness-125 transition-all shadow-sm`;
            card.dataset.id = post.id;
            card.onclick = (e) => { e.stopPropagation(); openModal(post.id); };

            const timeStr = post.time ? `<span class="text-[8px] md:text-[9px] text-gray-400 font-mono ml-auto bg-black/50 px-1 rounded hidden xs:inline">${post.time}</span>` : '';

            card.innerHTML = `
                ${statusDot}
                <div class="text-[9px] ${style.text} opacity-70 w-3 text-center shrink-0">${icon}</div>
                <div class="truncate flex-1">
                    <p class="text-[9px] md:text-[10px] font-bold text-gray-200 truncate leading-tight">${post.title}</p>
                </div>
                ${!isBacklog ? timeStr : ''}
            `;
            return card;
        }

        function handleDragEnd(evt) {
            const itemEl = evt.item;
            const postId = itemEl.dataset.id;
            const newContainer = evt.to;
            
            const postIndex = editorialPlan.findIndex(p => p.id === postId);
            if (postIndex === -1) return;

            if (newContainer.id === 'backlog-container') {
                editorialPlan[postIndex].date = '';
            } else {
                editorialPlan[postIndex].date = newContainer.dataset.date || '';
            }
            saveData();
            renderCalendar();
        }

        // --- Gaveta (Sidebar) Logic ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-backlog');
            const overlay = document.getElementById('mobile-overlay');
            const btnIcon = document.querySelector('#toggle-sidebar-btn i');
            
            if (sidebar.classList.contains('hidden')) {
                // Show
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
                overlay.classList.add('active'); // show mobile dark bg
                btnIcon.className = 'fa-solid fa-inbox text-brand-orange';
            } else {
                // Hide
                sidebar.classList.add('hidden');
                sidebar.classList.remove('flex');
                overlay.classList.remove('active'); // hide mobile dark bg
                btnIcon.className = 'fa-solid fa-inbox opacity-50';
            }
        }

        // --- Modal Logic ---
        function openModal(id = null, defaultDate = null, event = null) {
            if (event) event.stopPropagation();

            const modal = document.getElementById('post-modal');
            const content = document.getElementById('modal-content');
            const btnDelete = document.getElementById('btn-delete');
            
            if (id) {
                const post = editorialPlan.find(p => p.id === id);
                document.getElementById('modal-heading').innerText = 'Editar Postagem';
                document.getElementById('post-id').value = post.id;
                document.getElementById('post-title').value = post.title;
                document.getElementById('post-author').value = post.author;
                document.getElementById('post-format').value = post.format;
                document.getElementById('post-date').value = post.date || '';
                document.getElementById('post-time').value = post.time || '18:00';
                document.getElementById('post-status').value = post.status || 'ideia';
                document.getElementById('post-script').value = post.script ? post.script.replace(/<br\s*[\/]?>/gi, "\n") : '';
                btnDelete.classList.remove('hidden');
            } else {
                document.getElementById('modal-heading').innerText = 'Agendar Postagem';
                document.getElementById('post-id').value = '';
                document.getElementById('post-title').value = '';
                document.getElementById('post-author').value = 'Luan';
                document.getElementById('post-format').value = 'Reels';
                document.getElementById('post-date').value = defaultDate || '';
                document.getElementById('post-time').value = '18:00';
                document.getElementById('post-status').value = 'ideia';
                document.getElementById('post-script').value = '';
                btnDelete.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('post-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function savePost() {
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('post-title').value;
            
            if(!title.trim()) { alert('O título é obrigatório.'); return; }

            const postData = {
                title: title,
                author: document.getElementById('post-author').value,
                format: document.getElementById('post-format').value,
                date: document.getElementById('post-date').value,
                time: document.getElementById('post-time').value,
                status: document.getElementById('post-status').value,
                script: document.getElementById('post-script').value.replace(/\n/g, "<br>")
            };

            if (id) {
                const index = editorialPlan.findIndex(p => p.id === id);
                if(index !== -1) editorialPlan[index] = { id: id, ...postData };
            } else {
                postData.id = 'post-' + Date.now();
                editorialPlan.push(postData);
            }

            saveData();
            renderCalendar();
            closeModal();
        }

        function deletePost() {
            const id = document.getElementById('post-id').value;
            if(confirm('Tem certeza?')) {
                editorialPlan = editorialPlan.filter(p => p.id !== id);
                saveData();
                renderCalendar();
                closeModal();
            }
        }
    </script>
</body>
</html>
