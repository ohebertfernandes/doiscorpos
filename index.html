    <script>
        let editorialPlan = [
            { id: 'p1', author: 'Luan', format: 'Reels', title: 'A armadilha do "Lead Barato"', objective: 'Focar em Vendas, não em CPL', script: '**Gancho:** Seu marketing comemora o lead a 2 reais, mas o comercial não bate meta?\n\n**Desenvolvimento:** Luan explica que lead barato geralmente é curioso. No marketing de performance, o foco não é o custo do clique, é o custo do contrato assinado. O vendedor perde tempo com curioso e a empresa queima dinheiro.\n\n**CTA:** Pare de olhar pro CPC e olhe pro seu funil de vendas.', status: 'ideia', day: 'Sem Data' },
            { id: 'p2', author: 'Hebert', format: 'Carrossel', title: 'A conta que quebra empresas', objective: 'Introduzir o Unit Economics', script: '**Slide 1:** A matemática silenciosa que quebra empresas na internet.\n**Slide 2:** O erro: Escalar o Meta Ads sem saber seu CAC máximo (Custo de Aquisição).\n**Slide 3:** A solução: Unit Economics. Você precisa saber o limite de gasto por cliente.\n**Slide 4:** LTV (Lifetime Value). Seu cliente compra uma vez ou fica 1 ano? O seu modelo de negócios dita seu marketing.', status: 'ideia', day: 'Sem Data' },
            { id: 'p3', author: 'Raniele', format: 'Reels', title: 'Por que seu Instagram não vende?', objective: 'Desmistificar o Orgânico B2B', script: '**Gancho:** Você posta todos os dias, mas seu Instagram parece uma vitrine morta?\n\n**Desenvolvimento:** Raniele explica que empresa não precisa viralizar com dancinha. Orgânico B2B serve para construir um "ecossistema de confiança". Conteúdo profundo, que educa o lead, mata dúvidas técnicas e prova que você é especialista.', status: 'ideia', day: 'Sem Data' },
            { id: 'p4', author: 'Scale X', format: 'Estático', title: 'A Máquina e o Gargalo', objective: 'Reforçar o método e a Teoria das Restrições', script: '**Imagem:** Ilustração de engrenagens / Máquina.\n\n**Legenda:** Toda empresa é uma máquina. E se você colocar mais combustível (tráfego pago) enquanto o cano está furado (retenção ou comercial fraco), o motor explode. A Scale X não acelera antes de consertar a sua engrenagem.', status: 'ideia', day: 'Sem Data' },
            { id: 'p5', author: 'Luan', format: 'Carrossel', title: 'Engenharia > Criatividade', objective: 'Mostrar que performance é processo', script: '**Slide 1:** O marketing "fofinho" não paga a folha de pagamento.\n**Slide 2:** Agência comum: Foca em Layout bonito e posts de bom dia.\n**Slide 3:** Engenharia de Vendas (Nós): Funil mapeado, script alinhado, traqueamento de eventos (Pixel) e remarketing dinâmico.', status: 'ideia', day: 'Sem Data' },
            { id: 'p6', author: 'Raniele', format: 'Reels', title: 'Orgânico como Quebra de Objeções', objective: 'Conectar Orgânico ao Tráfego Pago', script: '**Gancho:** Você acha que orgânico e tráfego pago não se misturam? Errado.\n\n**Desenvolvimento:** Raniele ensina que quando o lead clica no seu anúncio, a primeira coisa que ele faz é ir no seu perfil stalkear. Se o seu perfil tem conteúdo forte explicando o método e quebrando objeções comuns, o lead chega no seu comercial 50% mais pronto para comprar.', status: 'ideia', day: 'Sem Data' },
            { id: 'p7', author: 'Scale X', format: 'Carrossel', title: 'A Metodologia I.O.E.', objective: 'Apresentar a arquitetura da Scale X', script: '**Slide 1:** A anatomia do crescimento previsível da Scale X.\n**Slide 2:** [ I ] Intelligence: O Raio-X de 30 dias. Onde está o gargalo?\n**Slide 3:** [ O ] Operation: Arrumar a casa. Implementar CRM, LPs, Dados.\n**Slide 4:** [ E ] Escala: O pé no acelerador. Advisory de Growth.', status: 'ideia', day: 'Sem Data' },
            { id: 'p8', author: 'Hebert', format: 'Reels', title: 'O Custo Invisível do Churn', objective: 'Focar na Retenção Financeira', script: '**Gancho:** Você gasta rios de dinheiro comprando cliente novo, só para perder os antigos no mês seguinte.\n\n**Desenvolvimento:** Hebert explica o conceito financeiro do balde furado. Na lógica de consultoria de negócios, não adianta tracionar vendas se o "Churn" (taxa de cancelamento) é alto. O verdadeiro lucro mora no LTV e no Upsell.', status: 'ideia', day: 'Sem Data' },
            { id: 'p9', author: 'Luan', format: 'Reels', title: 'O Fim do Mkt de Esperança', objective: 'Atacar o mercado de achismos', script: '**Gancho:** "Impulsionei um post aqui, vamos cruzar os dedos pra vender". Se você age assim, sua empresa corre risco.\n\n**Desenvolvimento:** Luan ataca o modelo de intuição. Explica que crescimento real é um loop de dados: Teste -> Análise de CAC -> Otimização -> Escala. Se não é rastreável, não é growth.', status: 'ideia', day: 'Sem Data' },
            { id: 'p10', author: 'Hebert', format: 'Carrossel', title: 'O custo de não ter processos', objective: 'A dor da desorganização comercial', script: '**Slide 1:** Quanto custa a desorganização do seu time comercial hoje?\n**Slide 2:** O marketing traz o lead, mas o vendedor demora 2 horas para chamar = Dinheiro rasgado.\n**Slide 3:** O lead não compra hoje e ninguém faz follow-up amanhã = Dinheiro rasgado.', status: 'ideia', day: 'Sem Data' },
            { id: 'p11', author: 'Scale X', format: 'Reels', title: 'Bastidores: A Reunião do Board', objective: 'Prova Social (Skin in the game)', script: '**Formato:** Vídeo estilo vlog corporativo.\n\n**Cena:** O Board da Scale X discutindo a operação de um cliente. Luan falando sobre CAC e CPC, Hebert cruzando isso com a estrutura do funil no CRM, Raniele propondo uma linha editorial para reduzir atrito.', status: 'ideia', day: 'Sem Data' },
            { id: 'p12', author: 'Raniele', format: 'Estático', title: 'Autoridade não se compra', objective: 'Focar na base orgânica de longo prazo', script: '**Imagem Limpa e Direta:** "Tráfego pago compra atenção. Conteúdo orgânico compra confiança."\n\n**Legenda:** Raniele explica que injetar dinheiro no Meta Ads vai atrair olhos para a sua empresa, mas se a pessoa entrar na sua "casa" (seu Instagram/Site) e não vir profundidade, ela vai comprar do seu concorrente.', status: 'ideia', day: 'Sem Data' },
            { id: 'p13', author: 'Luan', format: 'Carrossel', title: 'Qual dessas 4 travas é a sua?', objective: 'Diagnóstico rápido para o leitor', script: '**Slide 1:** Onde a sua máquina de receita engasgou?\n**Slide 2:** 1. Cegueira de Dados? (Não sabe de onde o cliente vem).\n**Slide 3:** 2. Tráfego desqualificado? (Muito curioso, pouco decisor).\n**Slide 4:** 3. Script falho? (Lead bom chega, mas o time não fecha).\n**Slide 5:** 4. Churn alto? (Vende muito e cancela muito).', status: 'ideia', day: 'Sem Data' },
            { id: 'p14', author: 'Hebert', format: 'Reels', title: 'Faça a conta: Calculadora ROI', objective: 'Prova Lógica Financeira', script: '**Gancho:** Você sabe me dizer exatamente quanto lucra a cada 100 reais investidos em marketing?\n\n**Desenvolvimento:** Hebert apresenta a lógica do Simulador de ROI. Explica que o papel do CEO não é aprovar layout, é olhar para o painel de Unit Economics e entender se a máquina está imprimindo ou rasgando dinheiro.', status: 'ideia', day: 'Sem Data' },
            { id: 'p15', author: 'Scale X', format: 'Reels', title: 'Por que recusamos clientes', objective: 'Gerar Escassez e Autoridade', script: '**Locução Oficial:** Todo mês nós recusamos projetos na Scale X.\n\n**Desenvolvimento:** Se a empresa chega querendo "pular etapas" e recusa fazer o Diagnóstico inicial (Blueprint), nós não assumimos a conta. Entrar operando tráfego sem entender os processos comerciais da empresa é receita pro fracasso.', status: 'ideia', day: 'Sem Data' },
            { id: 'p16', author: 'Scale X', format: 'Estático', title: 'Sua empresa qualifica para o I.O.E?', objective: 'Chamada Final (Blueprint)', script: '**Imagem:** Layout premium convidando para a Sessão Estratégica.\n\n**Legenda:** Buscamos empresas que entendem que o marketing precisa ser gerido por dados financeiros e engenharia de vendas. Abrimos aplicações para a Fase 1 da nossa metodologia (Blueprint Estratégico).', status: 'ideia', day: 'Sem Data' }
        ];

        // Cores dos Autores
        const authorConfig = {
            'Luan': { bg: 'bg-blue-500/20', text: 'text-blue-400', border: 'border-blue-500/30' },
            'Hebert': { bg: 'bg-emerald-500/20', text: 'text-emerald-400', border: 'border-emerald-500/30' },
            'Raniele': { bg: 'bg-purple-500/20', text: 'text-purple-400', border: 'border-purple-500/30' },
            'Scale X': { bg: 'bg-brand-orange/20', text: 'text-brand-orange', border: 'border-brand-orange/30' }
        };

        const formatIcons = {
            'Reels': '<i class="fa-brands fa-instagram text-pink-500"></i>',
            'Carrossel': '<i class="fa-solid fa-layer-group text-blue-400"></i>',
            'Estático': '<i class="fa-regular fa-image text-gray-400"></i>'
        };

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderKanban();
            initSortable();
        });

        function loadData() {
            const savedData = localStorage.getItem('scalex_editorial_v4');
            if (savedData) {
                const parsed = JSON.parse(savedData);
                // Atualizar os status salvos no array principal
                editorialPlan.forEach(post => {
                    const savedPost = parsed.find(p => p.id === post.id);
                    if (savedPost) {
                        post.status = savedPost.status;
                        post.title = savedPost.title;
                        post.script = savedPost.script;
                        post.objective = savedPost.objective;
                    }
                });
                // Adicionar posts criados manualmente
                parsed.forEach(savedPost => {
                    if (!editorialPlan.find(p => p.id === savedPost.id)) {
                        editorialPlan.push(savedPost);
                    }
                });
            }
        }

        function saveData() {
            localStorage.setItem('scalex_editorial_v4', JSON.stringify(editorialPlan));
            updateCounters();
        }

        function updateCounters() {
            document.getElementById('count-ideia').innerText = editorialPlan.filter(p => p.status === 'ideia').length;
            document.getElementById('count-producao').innerText = editorialPlan.filter(p => p.status === 'producao').length;
            document.getElementById('count-agendado').innerText = editorialPlan.filter(p => p.status === 'agendado').length;
            document.getElementById('count-postado').innerText = editorialPlan.filter(p => p.status === 'postado').length;
        }

        function renderKanban() {
            const columns = ['ideia', 'producao', 'agendado', 'postado'];
            
            columns.forEach(col => {
                const el = document.getElementById(`col-${col}`);
                el.innerHTML = ''; // Limpar coluna
                
                const posts = editorialPlan.filter(p => p.status === col);
                
                posts.forEach(post => {
                    const style = authorConfig[post.author] || authorConfig['Scale X'];
                    const icon = formatIcons[post.format] || '<i class="fa-solid fa-file"></i>';
                    
                    const card = document.createElement('div');
                    card.className = 'glass-panel p-4 rounded-xl cursor-grab mb-3 hover:border-brand-orange/50 transition-colors border border-brand-border bg-black/40 group';
                    card.dataset.id = post.id;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2 py-0.5 rounded text-[9px] font-bold uppercase ${style.bg} ${style.text} ${style.border} border">${post.author}</span>
                            <div class="flex gap-2">
                                <button onclick="openModal('${post.id}')" class="text-gray-600 hover:text-white transition-colors opacity-0 group-hover:opacity-100"><i class="fa-solid fa-pen text-xs"></i></button>
                            </div>
                        </div>
                        <h3 class="text-white font-bold text-sm leading-snug mb-3 pr-2">${post.title}</h3>
                        <div class="flex items-center justify-between mt-2 pt-3 border-t border-brand-border/50">
                            <div class="flex items-center gap-1.5 text-[10px] text-gray-400 font-medium">
                                ${icon} <span>${post.format}</span>
                            </div>
                            ${post.week ? `<span class="text-[9px] text-gray-500 font-mono">Sem ${post.week}</span>` : ''}
                        </div>
                    `;
                    el.appendChild(card);
                });
            });
            updateCounters();
        }

        function initSortable() {
            const columns = ['ideia', 'producao', 'agendado', 'postado'];
            
            columns.forEach(col => {
                const el = document.getElementById(`col-${col}`);
                new Sortable(el, {
                    group: 'kanban', // set both lists to same group
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onEnd: function (evt) {
                        const itemEl = evt.item;
                        const newStatus = evt.to.id.replace('col-', '');
                        const postId = itemEl.dataset.id;
                        
                        // Atualizar status no banco
                        const postIndex = editorialPlan.findIndex(p => p.id === postId);
                        if (postIndex !== -1) {
                            editorialPlan[postIndex].status = newStatus;
                            saveData();
                        }
                    },
                });
            });
        }

        // --- MODAL LÓGICA ---
        function openModal(id = null) {
            const modal = document.getElementById('post-modal');
            const content = document.getElementById('modal-content');
            const btnDelete = document.getElementById('btn-delete');
            
            if (id) {
                // Editar
                const post = editorialPlan.find(p => p.id === id);
                document.getElementById('modal-heading').innerText = 'Editar Post';
                document.getElementById('post-id').value = post.id;
                document.getElementById('post-title').value = post.title;
                document.getElementById('post-author').value = post.author;
                document.getElementById('post-format').value = post.format;
                document.getElementById('post-objective').value = post.objective || '';
                // Como o script antigo tem tags HTML (<br>), trocamos por quebra de linha normal para edição no textarea
                let cleanScript = post.script ? post.script.replace(/<br\s*[\/]?>/gi, "\n") : '';
                document.getElementById('post-script').value = cleanScript;
                
                btnDelete.classList.remove('hidden');
            } else {
                // Novo
                document.getElementById('modal-heading').innerText = 'Nova Ideia';
                document.getElementById('post-id').value = '';
                document.getElementById('post-title').value = '';
                document.getElementById('post-author').value = 'Luan';
                document.getElementById('post-format').value = 'Reels';
                document.getElementById('post-objective').value = '';
                document.getElementById('post-script').value = '';
                
                btnDelete.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('post-modal');
            const content = document.getElementById('modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function savePost() {
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('post-title').value;
            
            if(!title.trim()) {
                alert('O título é obrigatório.');
                return;
            }

            let scriptText = document.getElementById('post-script').value;
            // Opcional: Converter quebras de linha de volta para <br> para manter o layout da outra tela, mas se for só texto não tem problema.
            scriptText = scriptText.replace(/\n/g, "<br>");

            const postData = {
                title: title,
                author: document.getElementById('post-author').value,
                format: document.getElementById('post-format').value,
                objective: document.getElementById('post-objective').value,
                script: scriptText,
                status: 'ideia', // Se for novo, vai para ideias. Se for edição, mantém o que estava
                week: null, // Posts soltos não têm semana fixa obrigatória
                day: 'Sem Data'
            };

            if (id) {
                // Atualizar existente
                const index = editorialPlan.findIndex(p => p.id === id);
                if(index !== -1) {
                    postData.status = editorialPlan[index].status; // manter a coluna
                    postData.week = editorialPlan[index].week;
                    postData.day = editorialPlan[index].day;
                    editorialPlan[index] = { id: id, ...postData };
                }
            } else {
                // Criar novo
                postData.id = 'post-' + Date.now();
                editorialPlan.push(postData);
            }

            saveData();
            renderKanban();
            closeModal();
        }

        function deletePost() {
            const id = document.getElementById('post-id').value;
            if(confirm('Tem certeza que deseja excluir esta ideia?')) {
                editorialPlan = editorialPlan.filter(p => p.id !== id);
                saveData();
                renderKanban();
                closeModal();
            }
        }
    </script>
</body>
</html>
